  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Registration Portal</h1>
    <p>Matias WEBSITE</p>
  </header>
 
  <section class="form-section">
    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="firstName">First Name *</label>
        <input type="text" id="firstName" required>
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name *</label>
        <input type="text" id="lastName" required>
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" required>
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="programme">Programme *</label>
        <select id="programme" required>
          <option value="">-- Select Programme --</option>
          <option value="Communication">Communication</option>
          <option value="Networking">Networking</option>
          <option value="Software">Software</option>
        </select>
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="year">Year *</label>
        <select id="year" required>
          <option value="">-- Select Year --</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="interests">Interests</label>
        <input type="text" id="interests" placeholder="e.g. games, Web Dev, movies">
      </div>

      <div class="form-group">
        <label for="photo">Photo URL</label>
        <input type="url" id="photo" placeholder="http://example.com/photo.jpg">
      </div>

      <button type="submit">Add Student</button>
      <div id="feedback" aria-live="polite"></div>
    </form>
  </section>

  <section class="search-section">
    <h2>Search Students</h2>
    <input type="text" id="searchInput" placeholder="Search by name, email, or programme...">
  </section>

  <section class="cards-section">
    <h2>Profile Cards</h2>
    <div id="profileCards" class="cards-container"></div>
  </section>

  <section class="table-section">
    <h2>Registered Students</h2>
    <table id="summaryTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Programme</th>
          <th>Year</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>
